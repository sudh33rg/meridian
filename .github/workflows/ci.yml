name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian_local_only
          POSTGRES_DB: meridian_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://meridian:meridian_local_only@localhost:5432/meridian_test
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: OpenAPI spec is current
        run: cargo run --quiet -- --openapi | diff -u ../../docs/openapi.json -

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run gen:api && git diff --exit-code src/api-schema.d.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  smoke:
    needs: [rust]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian_local_only
          POSTGRES_DB: meridian
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - name: Start API
        working-directory: apps/server
        env:
          DATABASE_URL: postgres://meridian:meridian_local_only@localhost:5432/meridian
        run: |
          cargo build
          ./target/debug/meridian-api > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/ready && break; sleep 1; done
      - run: python3 tests/smoke.py

  e2e:
    needs: [rust, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian_local_only
          POSTGRES_DB: meridian
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U meridian"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Platform folders are generated, not committed (see docs/README.md).
      - run: flutter create --project-name meridian_mobile --platforms android,ios .
      - run: flutter pub get
      - run: flutter analyze
