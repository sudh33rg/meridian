server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Fonts are the only third-party origin (Google Fonts, imported by style.css).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  # Terminate TLS in front of this container and add: Strict-Transport-Security "max-age=31536000; includeSubDomains"
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    # $http_host keeps the port, which the API compares with the browser's Origin header (CSRF check).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
  }
  location /health {proxy_pass http://api:8080;}
  location /ready {proxy_pass http://api:8080;}
  location / { try_files $uri $uri/ /index.html; }
}
