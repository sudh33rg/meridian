server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Everything is served from this origin (fonts are bundled), so the policy is self-only.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  # Terminate TLS in front of this container and add: Strict-Transport-Security "max-age=31536000; includeSubDomains"
  location /api/ {
    proxy_pass http://api:9990;
    proxy_http_version 1.1;
    # $http_host keeps the port, which the API compares with the browser's Origin header (CSRF check).
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
  }
  # Collaborative editing (WebSocket) and the live change feed (server-sent events).
  location /api/collab/ {
    proxy_pass http://api:9990;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
  }
  location /api/sync/stream {
    proxy_pass http://api:9990;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
  # Attachments up to MAX_ATTACHMENT_MB (default 25) plus overhead.
  client_max_body_size 30m;
  location /scim/ { proxy_pass http://api:9990; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /health {proxy_pass http://api:9990;}
  location /ready {proxy_pass http://api:9990;}
  location / { try_files $uri $uri/ /index.html; }
}
