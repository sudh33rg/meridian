# Development-only all-in-one preview. Do not deploy with these credentials.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: ${MERIDIAN_DB_PASSWORD:-local_dev_only}
      POSTGRES_DB: meridian
    volumes: [meridian_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U meridian -d meridian']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgres://meridian:${MERIDIAN_DB_PASSWORD:-local_dev_only}@postgres:5432/meridian
      CORS_ORIGIN: http://localhost:9991
      BIND_ADDRESS: 0.0.0.0:9990
      RUST_LOG: info
      PUBLIC_URL: http://localhost:9991
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Meridian <no-reply@meridian.local>
      TRUST_PROXY: 'true'
      METRICS_ADDR: 0.0.0.0:9090
      ATTACHMENTS_DIR: /data/attachments
      # Dev-only; set a real 32+ character APP_SECRET in any shared environment.
      APP_SECRET: ${MERIDIAN_APP_SECRET:-dev-only-secret-change-me-0123456789abcdef}
    depends_on:
      postgres: {condition: service_healthy}
      mailpit: {condition: service_started}
    volumes: ['attachments_data:/data/attachments']
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025']
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports: ['9991:80']
    depends_on: [api]
    restart: unless-stopped
volumes:
  meridian_data:
  attachments_data:
