# Reference only. Replace image names, secrets, DB and ingress before deployment.
apiVersion: apps/v1
kind: Deployment
metadata: {name: meridian-api, labels: {app: meridian-api}}
spec:
  replicas: 2
  selector: {matchLabels: {app: meridian-api}}
  template:
    metadata: {labels: {app: meridian-api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: registry.example.com/meridian/api:replace-with-immutable-digest
          ports: [{containerPort: 9990, name: http}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: meridian-secrets, key: database-url}}
            - name: CORS_ORIGIN
              value: https://meridian.example.com
            - name: BIND_ADDRESS
              value: 0.0.0.0:9990
            - name: APP_ENV
              value: production
            - name: APP_SECRET
              valueFrom: {secretKeyRef: {name: meridian-secrets, key: app-secret}}
            - name: SMTP_URL
              valueFrom: {secretKeyRef: {name: meridian-secrets, key: smtp-url}}
            - name: MAIL_FROM
              value: Meridian <no-reply@meridian.example.com>
            - name: PUBLIC_URL
              value: https://meridian.example.com
            - name: TRUST_PROXY
              value: 'true'
            - name: LOG_FORMAT
              value: json
            - name: METRICS_ADDR
              value: 0.0.0.0:9090
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 3, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 5, periodSeconds: 15}
          resources: {requests: {cpu: 100m, memory: 160Mi}, limits: {cpu: '1', memory: 768Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: meridian-api}
spec:
  selector: {app: meridian-api}
  ports: [{port: 9990, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: meridian-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: meridian-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
