apiVersion: apps/v1
kind: Deployment
metadata: {name: meridian-web}
spec:
  replicas: 2
  selector: {matchLabels: {app: meridian-web}}
  template:
    metadata: {labels: {app: meridian-web}}
    spec:
      containers:
        - name: web
          image: registry.example.com/meridian/web:replace-with-immutable-digest
          ports: [{containerPort: 80, name: http}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 300m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: meridian-web}
spec:
  selector: {app: meridian-web}
  ports: [{port: 80, targetPort: http}]
