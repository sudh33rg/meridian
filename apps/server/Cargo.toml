[package]
name = "meridian-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "timeout", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
utoipa = { version = "5", features = ["uuid", "chrono"] }
hmac = "0.12"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "webpki-roots", "ring", "hostname"] }
governor = "0.8"
base64 = "0.22"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
openidconnect = "4"
object_store = { version = "0.12", features = ["aws"] }
yrs = "0.24"
futures-util = "0.3.34"
tokio-stream = "0.1.19"
infer = "0.19"
ammonia = "4"
url = "2"
tokio-util = { version = "0.7.20", features = ["io"] }
bytes = "1.12.1"
aes-gcm = "0.10"
totp-rs = { version = "5", features = ["otpauth"] }
hickory-resolver = "0.25"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
