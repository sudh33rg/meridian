[package]
name = "meridian-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "timeout", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
utoipa = { version = "5", features = ["uuid", "chrono"] }
hmac = "0.12"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "webpki-roots", "ring", "hostname"] }
governor = "0.8"
base64 = "0.22"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
